name: Build OpenWrt aarch64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: hrimfaxi/tutuicmptunnel-kmod
          ref: master
          submodules: recursive

      - name: Setup deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget bison flex ccache pkg-config autoconf automake libtool zip libgmp-dev

      - name: Download SDK
        run: |
          set -e
          cd /tmp
          URL="https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/qualcommax/ipq60xx/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -q --timeout=600 "$URL"
          tar --zstd -xf immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst

      - name: Run build (capture all errors)
        run: |
          set -e
          SDK=/tmp/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64

          # 1. Diagnose toolchain
          echo "=== TOOLCHAIN ===" > diag.txt
          ls $SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/ >> diag.txt
          $SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/aarch64-openwrt-linux-gcc --version >> diag.txt 2>&1

          # 2. Kernel
          KDIR=$(find $SDK/build_dir -maxdepth 2 -name "linux-ipq60xx_generic" -type d | head -1)
          echo "KDIR=$KDIR" >> diag.txt
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" $KDIR/Makefile >> diag.txt 2>/dev/null

          # 3. Build libsodium
          echo "=== LIBSODIUM ===" >> diag.txt
          cd /tmp
          git clone --depth 1 --branch 1.0.20-RELEASE https://github.com/jedisct1/libsodium.git libsodium-src
          cd libsodium-src
          ./autogen.sh >> diag.txt 2>&1
          export CC=$SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/aarch64-openwrt-linux-gcc
          ./configure --host=aarch64-openwrt-linux --prefix=/tmp/libsodium-out >> diag.txt 2>&1
          make -j$(nproc) >> diag.txt 2>&1
          make install >> diag.txt 2>&1

          # 4. Build tutuicmptunnel
          echo "=== TUTU ===" >> diag.txt
          cd /home/runner/work/tutuicmptunnel-kmod/tutuicmptunnel-kmod
          export STAGING_DIR=$SDK/staging_dir
          export TOOLCHAIN=$STAGING_DIR/toolchain-aarch64_cortex-a53_musl
          export TARGETROOT=$STAGING_DIR/target-aarch64_cortex-a53_musl
          export PATH=$STAGING_DIR/host/bin:$PATH
          rm -f CMakeCache.txt
          cmake -DCMAKE_TOOLCHAIN_FILE=$(pwd)/toolchains/openwrt-aarch64.cmake \
                -DBISON_EXECUTABLE=/usr/bin/bison \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_HARDEN_MODE=ON \
                -DSODIUM_INCLUDE_DIR=/tmp/libsodium-out/include \
                -DSODIUM_LIBRARY=/tmp/libsodium-out/lib/libsodium.so \
                . >> diag.txt 2>&1
          make -j$(nproc) >> diag.txt 2>&1
          make install DESTDIR=stripped >> diag.txt 2>&1

          # 5. Kernel module
          echo "=== KMOD ===" >> diag.txt
          cd kmod
          make KSRC=$KDIR CROSS_COMPILE=$SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/aarch64-openwrt-linux- ARCH=arm64 >> diag.txt 2>&1
          file tutuicmptunnel.ko >> diag.txt 2>&1

          echo "=== RESULT ===" >> diag.txt
          ls -la tutuicmptunnel.ko >> diag.txt 2>&1
          echo "BUILD_OK" >> diag.txt

          # Upload diagnostics
          mkdir -p $GITHUB_WORKSPACE/output
          cp diag.txt $GITHUB_WORKSPACE/output/
          cp stripped/usr/local/bin/tuctl_client $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp stripped/usr/local/sbin/ktuctl $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp kmod/tutuicmptunnel.ko $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp /tmp/libsodium-out/lib/libsodium.so $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          ls -la $GITHUB_WORKSPACE/output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/
