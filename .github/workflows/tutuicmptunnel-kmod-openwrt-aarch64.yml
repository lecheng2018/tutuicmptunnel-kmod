name: Build OpenWrt aarch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: hrimfaxi/tutuicmptunnel-kmod
          ref: master

      - name: Build all
        run: |
          WORKDIR=/home/runner/work/tutuicmptunnel-kmod/tutuicmptunnel-kmod
          OUTDIR=$GITHUB_WORKSPACE/output
          mkdir -p $OUTDIR

          echo "=== STEP 1: Install deps ==="
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake git wget bison flex ccache pkg-config autoconf automake libtool zip libgmp-dev

          echo "=== STEP 2: Download SDK ==="
          cd /tmp
          URL="https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/qualcommax/ipq60xx/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -q --timeout=600 "$URL"
          tar --zstd -xf immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          SDK=/tmp/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64

          echo "=== STEP 3: Diagnose SDK ==="
          echo "--- toolchain binaries ---"
          find $SDK/staging_dir/toolchain* -name "aarch64-*" -type f 2>/dev/null | head -10
          echo "--- kernel build dir ---"
          KDIR=$(find $SDK/build_dir -maxdepth 4 -name "linux-ipq60xx_generic" -type d 2>/dev/null | head -1)
          echo "KDIR=$KDIR"
          test -f "$KDIR/Makefile" && echo "Makefile exists" || echo "NO MAKEFILE"
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" $KDIR/Makefile 2>/dev/null || echo "no version in Makefile"

          echo "=== STEP 4: Build libsodium ==="
          cd /tmp
          git clone --depth 1 --branch 1.0.20-RELEASE https://github.com/jedisct1/libsodium.git libsodium-src
          cd libsodium-src
          ./autogen.sh
          CC=$SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/aarch64-openwrt-linux-gcc \
          ./configure --host=aarch64-openwrt-linux --prefix=/tmp/libsodium-out || { echo "LIBSODIUM_CONFIGURE_FAIL"; }
          make -j$(nproc) || { echo "LIBSODIUM_MAKE_FAIL"; }
          make install || { echo "LIBSODIUM_INSTALL_FAIL"; }
          ls /tmp/libsodium-out/lib/ 2>/dev/null || echo "no sodium lib"

          echo "=== STEP 5: Build tutuicmptunnel ==="
          cd $WORKDIR
          export STAGING_DIR=$SDK/staging_dir
          export TOOLCHAIN=$STAGING_DIR/toolchain-aarch64_cortex-a53_musl
          export TARGETROOT=$STAGING_DIR/target-aarch64_cortex-a53_musl
          export PATH=$STAGING_DIR/host/bin:$PATH
          rm -f CMakeCache.txt
          cmake -DCMAKE_TOOLCHAIN_FILE=$(pwd)/toolchains/openwrt-aarch64.cmake \
                -DBISON_EXECUTABLE=/usr/bin/bison \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_HARDEN_MODE=ON \
                -DSODIUM_INCLUDE_DIR=/tmp/libsodium-out/include \
                -DSODIUM_LIBRARY=/tmp/libsodium-out/lib/libsodium.so \
                . || echo "CMAKE_FAIL"
          make -j$(nproc) || echo "TUTU_MAKE_FAIL"
          make install DESTDIR=stripped || echo "TUTU_INSTALL_FAIL"
          find stripped -type f 2>/dev/null | head -20 || echo "no stripped dir"

          echo "=== STEP 6: Build kmod ==="
          cd $WORKDIR/kmod
          test -f Makefile.in && { echo "Makefile.in exists, need cmake first"; }
          make KSRC=$KDIR CROSS_COMPILE=$SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/aarch64-openwrt-linux- ARCH=arm64 || echo "KMOD_FAIL"
          file tutuicmptunnel.ko 2>/dev/null || echo "no kmod"

          echo "=== STEP 7: Package ==="
          cp $WORKDIR/stripped/usr/local/bin/tuctl_client $OUTDIR/ 2>/dev/null || echo "no tuctl_client"
          cp $WORKDIR/stripped/usr/local/sbin/ktuctl $OUTDIR/ 2>/dev/null || echo "no ktuctl"
          cp $WORKDIR/kmod/tutuicmptunnel.ko $OUTDIR/ 2>/dev/null || echo "no kmod"
          cp /tmp/libsodium-out/lib/libsodium.so $OUTDIR/ 2>/dev/null || echo "no sodium"
          ls -la $OUTDIR/
          file $OUTDIR/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tutuicmptunnel-kmod-aarch64
          path: output/
