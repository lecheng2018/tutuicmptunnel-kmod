name: Build OpenWrt aarch64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: hrimfaxi/tutuicmptunnel-kmod
          ref: master
          submodules: recursive

      - name: Setup deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget bison flex ccache pkg-config autoconf automake libtool zip

      - name: Download ImmortalWRT SDK
        run: |
          set -e
          cd /tmp
          URL="https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/qualcommax/ipq60xx/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -q --timeout=600 "$URL"
          tar --zstd -xf immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst

      - name: Build libsodium
        run: |
          set -e
          SDK=/tmp/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64
          export STAGING_DIR=$SDK/staging_dir
          export TOOLCHAIN=$STAGING_DIR/toolchain-aarch64_cortex-a53_musl
          export ARCH=aarch64
          cd /tmp
          git clone --depth 1 https://github.com/jedisct1/libsodium.git
          cd libsodium
          git checkout 1.0.20-RELEASE
          ./autogen.sh
          ./configure --host=$ARCH-openwrt-linux CC=$TOOLCHAIN/bin/$ARCH-openwrt-linux-gcc
          make -j$(nproc)

      - name: Build tutuicmptunnel-kmod
        run: |
          set -e
          SDK=/tmp/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64
          export STAGING_DIR=$SDK/staging_dir
          export TOOLCHAIN=$STAGING_DIR/toolchain-aarch64_cortex-a53_musl
          export TARGETROOT=$STAGING_DIR/target-aarch64_cortex-a53_musl
          export ARCH=aarch64
          export STAGING_DIR_HOST="$STAGING_DIR/host"
          export PKG_CONFIG_LIBDIR="$TARGETROOT/usr/lib/pkgconfig"
          export PKG_CONFIG="$STAGING_DIR_HOST/bin/pkg-config"
          export PATH="$STAGING_DIR_HOST/bin:$PATH"

          rm -f CMakeCache.txt
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$(pwd)/toolchains/openwrt-$ARCH.cmake \
            -DBISON_EXECUTABLE=/usr/bin/bison \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_HARDEN_MODE=ON \
            -DSODIUM_INCLUDE_DIR=/tmp/libsodium/src/libsodium/include \
            -DSODIUM_LIBRARY=/tmp/libsodium/src/libsodium/.libs/libsodium.so \
            .
          make -j$(nproc)
          make install DESTDIR=stripped

      - name: Build kernel module
        run: |
          set -e
          SDK=/tmp/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64
          export STAGING_DIR=$SDK/staging_dir
          export TOOLCHAIN=$STAGING_DIR/toolchain-aarch64_cortex-a53_musl
          export KERNEL_DIR=$(find $SDK/build_dir -maxdepth 2 -name 'linux-ipq60xx_generic' -path '*linux-*' | head -1)
          export ARCH=aarch64
          export KERNEL_ARCH=arm64
          echo "Kernel: $KERNEL_DIR"
          cd kmod
          make KSRC=$KERNEL_DIR CROSS_COMPILE=$TOOLCHAIN/bin/$ARCH-openwrt-linux- ARCH=$KERNEL_ARCH
          file tutuicmptunnel.ko

      - name: Package
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          cp stripped/usr/local/bin/tuctl_client $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp stripped/usr/local/sbin/ktuctl $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp /tmp/libsodium/src/libsodium/.libs/libsodium.so $GITHUB_WORKSPACE/output/
          cp kmod/tutuicmptunnel.ko $GITHUB_WORKSPACE/output/
          ls -la $GITHUB_WORKSPACE/output/
          file $GITHUB_WORKSPACE/output/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tutuicmptunnel-kmod-aarch64
          path: output/
