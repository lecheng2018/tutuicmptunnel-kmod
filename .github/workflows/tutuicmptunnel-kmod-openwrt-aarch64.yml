name: Build OpenWrt aarch64

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: hrimfaxi/tutuicmptunnel-kmod
          ref: master
          submodules: recursive

      - name: Setup deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget bison flex ccache pkg-config autoconf automake libtool zip libgmp-dev

      - name: Download SDK
        run: |
          set -e
          cd /tmp
          URL="https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/qualcommax/ipq60xx/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -q --timeout=600 "$URL"
          tar --zstd -xf immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst

      - name: Run full build
        run: |
          SDK=/tmp/immortalwrt-sdk-25.12-SNAPSHOT-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64
          WORKDIR=/home/runner/work/tutuicmptunnel-kmod/tutuicmptunnel-kmod

          # Toolchain diagnostics
          echo "=== TOOLCHAIN ===" > $WORKDIR/diag.txt
          ls $SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/ >> $WORKDIR/diag.txt
          $SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/aarch64-openwrt-linux-gcc --version >> $WORKDIR/diag.txt 2>&1

          # Kernel
          KDIR=$(find $SDK/build_dir -maxdepth 2 -name "linux-ipq60xx_generic" -type d | head -1)
          echo "KDIR=$KDIR" >> $WORKDIR/diag.txt
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" $KDIR/Makefile >> $WORKDIR/diag.txt 2>/dev/null || echo "no version" >> $WORKDIR/diag.txt

          # Libsodium
          echo "=== LIBSODIUM ===" >> $WORKDIR/diag.txt
          cd /tmp
          git clone --depth 1 --branch 1.0.20-RELEASE https://github.com/jedisct1/libsodium.git libsodium-src 2>&1 | tail -3 >> $WORKDIR/diag.txt
          cd libsodium-src
          ./autogen.sh >> $WORKDIR/diag.txt 2>&1 || echo "autogen FAILED" >> $WORKDIR/diag.txt
          CC=$SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/aarch64-openwrt-linux-gcc \
          ./configure --host=aarch64-openwrt-linux --prefix=/tmp/libsodium-out >> $WORKDIR/diag.txt 2>&1 || echo "configure FAILED" >> $WORKDIR/diag.txt
          make -j$(nproc) >> $WORKDIR/diag.txt 2>&1 || echo "make FAILED" >> $WORKDIR/diag.txt
          make install >> $WORKDIR/diag.txt 2>&1 || echo "install FAILED" >> $WORKDIR/diag.txt

          # Tutuicmptunnel
          echo "=== TUTUICMPTUNNEL ===" >> $WORKDIR/diag.txt
          cd $WORKDIR
          export STAGING_DIR=$SDK/staging_dir
          export TOOLCHAIN=$STAGING_DIR/toolchain-aarch64_cortex-a53_musl
          export TARGETROOT=$STAGING_DIR/target-aarch64_cortex-a53_musl
          export PATH=$STAGING_DIR/host/bin:$PATH
          rm -f CMakeCache.txt
          cmake -DCMAKE_TOOLCHAIN_FILE=$(pwd)/toolchains/openwrt-aarch64.cmake \
                -DBISON_EXECUTABLE=/usr/bin/bison \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_HARDEN_MODE=ON \
                -DSODIUM_INCLUDE_DIR=/tmp/libsodium-out/include \
                -DSODIUM_LIBRARY=/tmp/libsodium-out/lib/libsodium.so \
                . >> $WORKDIR/diag.txt 2>&1 || echo "cmake FAILED" >> $WORKDIR/diag.txt
          make -j$(nproc) >> $WORKDIR/diag.txt 2>&1 || echo "tutu make FAILED" >> $WORKDIR/diag.txt
          make install DESTDIR=stripped >> $WORKDIR/diag.txt 2>&1 || echo "tutu install FAILED" >> $WORKDIR/diag.txt

          # Kernel module
          echo "=== KMOD ===" >> $WORKDIR/diag.txt
          cd $WORKDIR/kmod
          make KSRC=$KDIR CROSS_COMPILE=$SDK/staging_dir/toolchain-aarch64_cortex-a53_musl/bin/aarch64-openwrt-linux- ARCH=arm64 >> $WORKDIR/diag.txt 2>&1 || echo "kmod make FAILED" >> $WORKDIR/diag.txt
          file tutuicmptunnel.ko >> $WORKDIR/diag.txt 2>&1 || echo "kmod not found" >> $WORKDIR/diag.txt

          echo "=== DONE ===" >> $WORKDIR/diag.txt

      - name: Package
        if: always()
        run: |
          WORKDIR=/home/runner/work/tutuicmptunnel-kmod/tutuicmptunnel-kmod
          mkdir -p $GITHUB_WORKSPACE/output
          cp $WORKDIR/diag.txt $GITHUB_WORKSPACE/output/
          cp $WORKDIR/stripped/usr/local/bin/tuctl_client $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp $WORKDIR/stripped/usr/local/sbin/ktuctl $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp $WORKDIR/kmod/tutuicmptunnel.ko $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp /tmp/libsodium-out/lib/libsodium.so $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          ls -la $GITHUB_WORKSPACE/output/
          file $GITHUB_WORKSPACE/output/* 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/
